# Kind cluster for the COMPLETE platform: 1 control-plane + 2 workers.
#
#   kind create cluster --config kind/kind-cluster.yaml
#   kind delete cluster --name product-platform
#
# Kind nodes are Docker containers. A port inside the cluster is only reachable from
# Windows if it is mapped here, at creation time (it can't be added later).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: product-platform
nodes:
  - role: control-plane
    extraPortMappings:
      # API Gateway NodePort Service  -> http://localhost:30080
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
      # NGINX Ingress Controller (HTTP)  -> http://platform.localtest.me
      - containerPort: 30100
        hostPort: 80
        listenAddress: "127.0.0.1"
      # NGINX Ingress Controller (HTTPS)
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
  - role: worker
  - role: worker
