# =============================================================================
# Option A (always available): the api-gateway on a fixed node port.
#   http://localhost:30080   (mapped in kind/kind-cluster.yaml)
# Only the GATEWAY is exposed - every other Service stays ClusterIP (internal),
# exactly like in compose where clients only used port 8080.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport
  namespace: product-platform
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: product-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
