# =============================================================================
# Schema Registry - stores the Avro schemas of all events (replaces compose "schema-registry").
# Stateless: the schemas themselves are stored IN Kafka (topic _schemas) -> a Deployment.
# Inside the cluster it listens on 8081 (compose mapped it to localhost:18081).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: product-platform
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: product-platform
spec:
  selector:
    app.kubernetes.io/name: schema-registry
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: product-platform
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: product-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: product-platform
    spec:
      # IMPORTANT: otherwise Kubernetes injects SCHEMA_REGISTRY_PORT=tcp://... which the
      # image reads as a setting -> startup fails.
      enableServiceLinks: false
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 kafka 9092; do echo 'waiting for kafka:9092'; sleep 3; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:8.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://kafka:9092"
            # Same rule as compose: every schema change must be FULL_TRANSITIVE compatible
            - name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL
              value: "full_transitive"
            - name: SCHEMA_REGISTRY_HEAP_OPTS
              value: "-Xms256m -Xmx256m"
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 15
            failureThreshold: 4
