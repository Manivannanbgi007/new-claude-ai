# =============================================================================
# Kafka UI (kafbat) - browse topics, messages, consumer groups, schemas and connectors.
# Replaces compose "kafka-ui". Open with:  kubectl port-forward svc/kafka-ui 8088:8080
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: product-platform
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/component: tooling
    app.kubernetes.io/part-of: product-platform
spec:
  selector:
    app.kubernetes.io/name: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: product-platform
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/component: tooling
    app.kubernetes.io/part-of: product-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-ui
        app.kubernetes.io/component: tooling
        app.kubernetes.io/part-of: product-platform
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          image: kafbat/kafka-ui:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "kind"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka:9092"
            - name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY
              value: "http://schema-registry:8081"
            - name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME
              value: "debezium"
            - name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS
              value: "http://kafka-connect:8083"
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
