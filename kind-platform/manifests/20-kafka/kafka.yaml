# =============================================================================
# Kafka (KRaft mode: no ZooKeeper) - replaces compose service "kafka".
# Same image and settings as docker-compose (confluentinc/cp-kafka:8.0.0, 1 broker).
#
# Difference to compose: compose needed TWO client listeners (kafka:29092 for containers,
# localhost:9092 for apps on Windows). In Kubernetes every client runs IN the cluster,
# so ONE listener is enough:   bootstrap address for all apps:  kafka:9092
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: product-platform
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: product-platform
spec:
  clusterIP: None                     # headless: gives the Pod the stable name kafka-0.kafka
  # Kafka must resolve its OWN DNS name while starting (controller quorum), i.e.
  # before the Pod is ready. Without this, the name only exists for READY Pods.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: client
      port: 9092
      targetPort: client
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: product-platform
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: product-platform
spec:
  serviceName: kafka
  replicas: 1                         # more brokers need different node ids/voters - see GUIDE.md
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: product-platform
    spec:
      # IMPORTANT for Confluent images: otherwise Kubernetes injects KAFKA_PORT=tcp://...
      # and the image turns every KAFKA_* variable into a broker setting -> startup fails.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000                 # the image runs as "appuser" (uid/gid 1000)
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:8.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            # Same CLUSTER_ID as compose (any base64 UUID; it identifies the storage)
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka.product-platform.svc.cluster.local:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            # The address clients are told to connect to: the Pod's stable DNS name
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka.product-platform.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # Single broker -> internal topics can only have 1 replica (same as compose)
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Topics are created explicitly by the kafka-topics Job, never by accident
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1Gi }
          startupProbe:
            tcpSocket:
              port: client
            periodSeconds: 5
            failureThreshold: 36            # up to 3 minutes for the first start
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
