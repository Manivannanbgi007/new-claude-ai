# =============================================================================
# Kafka Connect + Debezium MySQL connector - streams product_db changes into Kafka (CDC).
# Replaces compose "kafka-connect". Uses YOUR image built from infrastructure/kafka-connect
# (Confluent Connect + the Debezium plugin), loaded into Kind like the app images.
# Connect stores its state (configs, offsets, status) in Kafka topics -> a Deployment.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: product-platform
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/component: cdc
    app.kubernetes.io/part-of: product-platform
spec:
  selector:
    app.kubernetes.io/name: kafka-connect
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: product-platform
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/component: cdc
    app.kubernetes.io/part-of: product-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-connect
        app.kubernetes.io/component: cdc
        app.kubernetes.io/part-of: product-platform
    spec:
      enableServiceLinks: false      # Confluent image: avoid injected KAFKA_CONNECT_* variables
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: ["sh", "-c", "for hp in kafka:9092 schema-registry:8081 mysql-product:3306; do until nc -z -w 2 ${hp%:*} ${hp#*:}; do echo \"waiting for $hp\"; sleep 3; done; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: kafka-connect
          image: product-platform/kafka-connect:8.0.0-debezium-3.2.0.Final
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            # The address other Connect workers use to reach THIS one: its Pod IP
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CONNECT_REST_PORT
              value: "8083"
            - name: CONNECT_GROUP_ID
              value: "product-cdc-connect"
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: "_product_cdc_connect_configs"
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: "_product_cdc_connect_offsets"
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: "_product_cdc_connect_status"
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_VALUE_CONVERTER
              value: "io.confluent.connect.avro.AvroConverter"
            - name: CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL
              value: "http://schema-registry:8081"
            - name: CONNECT_PLUGIN_PATH
              value: "/usr/share/java,/usr/share/confluent-hub-components"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /connectors, port: http }
            periodSeconds: 5
            failureThreshold: 60             # plugin scanning makes the first start slow
          readinessProbe:
            httpGet: { path: /connectors, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /connectors, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
