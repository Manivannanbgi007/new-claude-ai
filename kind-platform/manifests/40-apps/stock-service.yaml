# =============================================================================
# stock-service (8082) - Stock levels; reserves/releases stock in the order saga (Kafka)
# Same pattern as the user-service reference: ConfigMap + Deployment + Service.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-service-config
  namespace: product-platform
  labels:
    app.kubernetes.io/name: stock-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: product-platform
data:
  STOCK_DB_URL: "jdbc:mysql://mysql-stock:3306/stock_db?connectionTimeZone=UTC"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  # ready = started + own database reachable
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
  # Kubernetes Services + DNS replace Eureka
  EUREKA_CLIENT_ENABLED: "false"
  # /actuator/health/liveness and /readiness
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  # finish running requests before the Pod stops
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "20s"
  # JSON logs on stdout (kubectl logs, later Loki)
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "ecs"
  # no log file in containers
  LOGGING_FILE_NAME: ""
  APP_ENVIRONMENT: "kind"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-service
  namespace: product-platform
  labels:
    app.kubernetes.io/name: stock-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: product-platform
spec:
  replicas: 1                          # laptop-friendly; scale with kubectl (GUIDE.md step 22)
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: stock-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: product-platform
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: stock-service
      # Kubernetes has no "depends_on": wait until every dependency accepts connections
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          env:
            - name: DEPENDS_ON
              value: "mysql-stock:3306 kafka:9092 schema-registry:8081"
          command: ["sh", "-c", "for hp in $DEPENDS_ON; do until nc -z -w 2 ${hp%:*} ${hp#*:}; do echo \"waiting for $hp\"; sleep 3; done; echo \"$hp is up\"; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: stock-service
          image: stock-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: stock-service-config
          env:                               # only the secret keys this app needs
            - name: STOCK_DB_USERNAME
              valueFrom:
                secretKeyRef: { name: stock-db-credentials, key: username }
            - name: STOCK_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: stock-db-credentials, key: password }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:                      # up to 60 x 5 s = 5 min (many JVMs start at once on a laptop)
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 200Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stock-service
  namespace: product-platform
  labels:
    app.kubernetes.io/name: stock-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: product-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stock-service
  ports:
    - name: http
      port: 8082
      targetPort: http
