# =============================================================================
# mysql-stock: MySQL for stock-service
# Replaces the docker-compose service "mysql".
#   Secret       credentials (used by MySQL AND by the application)
#   Service      headless: DNS name "mysql-stock" -> the MySQL Pod
#   StatefulSet  1 MySQL Pod with its own PersistentVolumeClaim (data survives restarts)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: stock-db-credentials
  namespace: product-platform
  labels:
    app.kubernetes.io/name: mysql-stock
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: product-platform
type: Opaque
stringData:               # LOCAL LEARNING ONLY - see GUIDE.md section 10 for real environments
  database: stock_db
  username: stock_user
  password: stock_dev_password
  root-password: root_dev_password
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-stock
  namespace: product-platform
  labels:
    app.kubernetes.io/name: mysql-stock
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: product-platform
spec:
  clusterIP: None                  # headless: required by the StatefulSet
  selector:
    app.kubernetes.io/name: mysql-stock
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-stock
  namespace: product-platform
  labels:
    app.kubernetes.io/name: mysql-stock
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: product-platform
spec:
  serviceName: mysql-stock
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-stock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-stock
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: product-platform
    spec:
      enableServiceLinks: false      # no Docker-link-style env vars (see GUIDE.md section 16)
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999                 # the mysql group may write to the volume
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          # Same server options as "command:" in docker-compose
          args:
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_0900_ai_ci"
            - "--binlog-row-image=FULL"
            - "--server-id=1"
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: stock-db-credentials, key: root-password } }
            - name: MYSQL_DATABASE
              valueFrom: { secretKeyRef: { name: stock-db-credentials, key: database } }
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: stock-db-credentials, key: username } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: stock-db-credentials, key: password } }
            - name: TZ
              value: UTC
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
