# =============================================================================
# mysql-product: MySQL for product-write-service (source of truth; binlog enabled for Debezium CDC)
# Replaces the docker-compose service "mysql-product".
#   Secret       credentials (used by MySQL AND by the application)
#   Service      headless: DNS name "mysql-product" -> the MySQL Pod
#   StatefulSet  1 MySQL Pod with its own PersistentVolumeClaim (data survives restarts)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: product-db-credentials
  namespace: product-platform
  labels:
    app.kubernetes.io/name: mysql-product
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: product-platform
type: Opaque
stringData:               # LOCAL LEARNING ONLY - see GUIDE.md section 10 for real environments
  database: product_db
  username: product_user
  password: product_dev_password
  root-password: product_root_dev_password
  debezium-password: debezium_dev_password
---
# Init script run by MySQL on its FIRST start (empty volume), like ./mysql-product/init in compose.
# A Secret (not a ConfigMap) because the SQL contains a password.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-product-init
  namespace: product-platform
  labels:
    app.kubernetes.io/name: mysql-product
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: product-platform
type: Opaque
stringData:
  01-create-debezium-user.sql: |
    -- Debezium's READ-ONLY replication user (password = debezium-password in product-db-credentials
    -- and database.password in the connector config, manifests/45-cdc/debezium-connector-job.yaml)
    CREATE USER IF NOT EXISTS 'debezium'@'%' IDENTIFIED BY 'debezium_dev_password';
    GRANT SELECT, RELOAD, SHOW DATABASES, LOCK TABLES, REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'debezium'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-product
  namespace: product-platform
  labels:
    app.kubernetes.io/name: mysql-product
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: product-platform
spec:
  clusterIP: None                  # headless: required by the StatefulSet
  selector:
    app.kubernetes.io/name: mysql-product
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-product
  namespace: product-platform
  labels:
    app.kubernetes.io/name: mysql-product
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: product-platform
spec:
  serviceName: mysql-product
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-product
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-product
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: product-platform
    spec:
      enableServiceLinks: false      # no Docker-link-style env vars (see GUIDE.md section 16)
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999                 # the mysql group may write to the volume
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          # Same server options as "command:" in docker-compose
          args:
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_0900_ai_ci"
            - "--log-bin=mysql-bin"
            - "--binlog-row-image=FULL"
            - "--binlog-expire-logs-seconds=604800"
            - "--server-id=2"
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: product-db-credentials, key: root-password } }
            - name: MYSQL_DATABASE
              valueFrom: { secretKeyRef: { name: product-db-credentials, key: database } }
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: product-db-credentials, key: username } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: product-db-credentials, key: password } }
            - name: TZ
              value: UTC
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init-scripts
          secret:
            secretName: mysql-product-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
