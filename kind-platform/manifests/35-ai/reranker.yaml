# =============================================================================
# Reranker - cross-encoder BAAI/bge-reranker-base served by Hugging Face TEI.
# Replaces compose "reranker". The model (~1 GB) is downloaded on the FIRST start
# into the PVC. rag-service keeps working without it (fused order) until it is ready.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: reranker
  namespace: product-platform
  labels:
    app.kubernetes.io/name: reranker
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: product-platform
spec:
  selector:
    app.kubernetes.io/name: reranker
  ports:
    - name: http
      port: 8095                   # same port number as compose used on localhost
      targetPort: http             # -> container port 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reranker
  namespace: product-platform
  labels:
    app.kubernetes.io/name: reranker
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: product-platform
spec:
  serviceName: reranker
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reranker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reranker
        app.kubernetes.io/component: ai
        app.kubernetes.io/part-of: product-platform
    spec:
      enableServiceLinks: false
      containers:
        - name: reranker
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
          imagePullPolicy: IfNotPresent
          args: ["--model-id", "BAAI/bge-reranker-base"]
          ports:
            - name: http
              containerPort: 80
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 2Gi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 120          # first start downloads the model: up to 20 minutes
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
