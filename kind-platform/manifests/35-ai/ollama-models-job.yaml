# =============================================================================
# Downloads the models into Ollama - replaces compose "ollama-model-init".
# The Job talks to the Ollama SERVER through its Service; the files end up on Ollama's PVC.
# First run: several GB -> up to 1 hour allowed. Later runs: seconds (already present).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-models
  namespace: product-platform
  labels:
    app.kubernetes.io/name: ollama-models
    app.kubernetes.io/part-of: product-platform
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-models
        app.kubernetes.io/part-of: product-platform
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: pull-models
          image: ollama/ollama:0.12.0          # only for its "ollama" CLI
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              until ollama list >/dev/null 2>&1; do echo "waiting for ollama"; sleep 3; done
              ollama pull "$OLLAMA_CHAT_MODEL"
              ollama pull "$OLLAMA_EMBEDDING_MODEL"
              ollama list
          env:
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
          envFrom:
            - configMapRef:
                name: ai-models
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
